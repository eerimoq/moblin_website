[package]
name = "moblin-website-backend"
version = "0.1.0"
edition = "2024"
description = "Backend for the Moblin website: which streamers recently went live with Moblin"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "query", "form"] }
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
x509-parser = { version = "0.18", features = ["verify"] }

[profile.release]
panic = "unwind"
