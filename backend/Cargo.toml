[package]
name = "moblin-website-backend"
version = "0.1.0"
edition = "2024"
description = "Backend for the Moblin website: which streamers recently went live with Moblin"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
panic = "unwind"
debug = true
