[general]
# The address of this machine, where a real Moblin device reaches the backend.
tester-ip-address = "macpro.home"
# The port the backend under test listens on, on all interfaces.
backend-port = 8090
# Accept live posts without App Attest. Set to false to test that only Moblin can post, with
# a Moblin debug build whose MOBLIN_WEBSITE_API_URL is http://<tester-ip-address>:<backend-port>.
allow-unattested = true
# app-attest-environment = "development"
